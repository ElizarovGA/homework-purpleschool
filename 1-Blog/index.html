        <h1>Теория цвета - Как цвет влияет на поведение потребителей</h1>
        <div>
          <div>
            <img src="#" alt="Фото автора" />
          </div>
          <div>
            <p>Наталья Васильева</p>
            <p>Разработчик</p>
          </div>
        </div>
        <figure>
        <img src="#" alt="Иллюстрация" />
        </figure>
        <figcaption>
        <p>
          Теория цвета — это особенности эмоционального восприятия человеком тех или иных цветовых
          решений. Цвета и различные их комбинации влияют на психику человека, а значит, во многом
          определяют его поведение. Маркетологи и веб-дизайнеры хорошо знают, что правильно
          подобранная цветовая гамма сайта помогает привлечь и удержать внимание пользователей,
          сформировать положительное отношение к продукту, подтолкнуть посетителей к совершению
          целевых действий, повысить конверсию.
        </p>
        <p>
          Универсального ответа на вопрос, как тот или иной цвет влияет на разных людей, нет.
          Эмоциональная и поведенческая реакция каждого человека зависит от личного опыта. Вместе с
          тем можно выделить определенные закономерности влияния цветов на поведение пользователей.
        </p>
        <p>
          В исследовании «Влияние цвета на маркетинг» (Impact of color on marketing) говорится, что
          использование разных цветов может существенно влиять на настроение и поведение
          потребителей. Утверждается, что от 60 до 90% покупателей (в зависимости от категории
          продукта) дают положительную или отрицательную оценку товару, основываясь только на его
          цвете.
        </p>
        </figcaption>
